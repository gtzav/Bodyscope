<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bodyscope: βίντεο</title>
<meta name="description" content="Τρία βίντεο που δείχνουν πώς χρησιμοποιείται το Bodyscope: γενική περιήγηση, γεύματα, δραστηριότητες.">
<link rel="icon" type="image/png" href="../bodyscope-icon.png?v=2">
<style>
  :root {
    --bg: #f6fafa; --surface: #ffffff; --text: #12262b; --muted: #4f6569;
    --line: #d7e6e7; --teal: #0f9a9c; --teal-strong: #0b7c7e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1719; --surface: #142225; --text: #e5f1f2; --muted: #9db4b7;
      --line: #25393d; --teal: #2cc3c5; --teal-strong: #4fd6d8;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  a { color: var(--teal-strong); }
  .back { display: inline-block; margin-bottom: 12px; font-size: 15px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  figure { margin: 0; background: var(--surface); border: 1px solid var(--line);
           border-radius: 14px; padding: 12px; }
  video { display: block; width: 100%; max-height: 78vh; border-radius: 10px; background: #000; }
  figcaption { padding: 10px 2px 2px; }
  figcaption b { display: block; font-size: 17px; }
  figcaption span { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <a class="back" href="../el/">← Bodyscope</a>
  <h1>Βίντεο: πώς χρησιμοποιείται το Bodyscope</h1>
  <p class="lead">Τρία σύντομα βίντεο, στα ελληνικά. Το βίντεο για τα γεύματα έχει υπότιτλους στα ελληνικά και στα αγγλικά (κουμπί CC του προγράμματος αναπαραγωγής).</p>
  <div class="grid">
    <figure>
      <video controls preload="metadata" playsinline src="bodyscope-1.mp4"></video>
      <figcaption><b>1. Γενική περιήγηση και ρυθμίσεις</b><span>7:08</span></figcaption>
    </figure>
    <figure>
      <video controls preload="metadata" playsinline src="bodyscope-2.mp4">
        <track kind="subtitles" srclang="el" label="Ελληνικά" src="bodyscope-2.el.vtt">
        <track kind="subtitles" srclang="en" label="English" src="bodyscope-2.en.vtt">
      </video>
      <figcaption><b>2. Γεύματα και τροφές</b><span>10:03 · υπότιτλοι: ελληνικά, English</span></figcaption>
    </figure>
    <figure>
      <video controls preload="metadata" playsinline src="bodyscope-3.mp4"></video>
      <figcaption><b>3. Δραστηριότητες</b><span>3:22</span></figcaption>
    </figure>
  </div>
</main>
</body>
</html>
