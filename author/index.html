<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bodyscope Author</title>
<meta name="description" content="About the author of Bodyscope.">
<link rel="icon" type="image/png" href="../bodyscope-icon.png?v=2">
<style>
  :root {
    --bg: #f6fafa; --surface: #ffffff; --text: #12262b; --muted: #4f6569;
    --line: #d7e6e7; --teal: #0f9a9c; --teal-strong: #0b7c7e; --violet: #6b2fd0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1719; --surface: #142225; --text: #e5f1f2; --muted: #9db4b7;
      --line: #25393d; --teal: #2cc3c5; --teal-strong: #4fd6d8; --violet: #a77cf2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1719; --surface: #142225; --text: #e5f1f2; --muted: #9db4b7;
    --line: #25393d; --teal: #2cc3c5; --teal-strong: #4fd6d8; --violet: #a77cf2;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans",
          "Helvetica Neue", Arial, sans-serif;
  }
  a { color: var(--teal-strong); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; width: 100%; }
  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; height: 62px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none;
           color: var(--text); font-weight: 700; font-size: 19px; }
  .brand img { width: 34px; height: 34px; }
  header .back { margin-left: auto; font-size: 15px; color: var(--muted); text-decoration: none; }
  header .back:hover { color: var(--text); }
  main { flex: 1; padding: 64px 0; }
  h1 { font-size: clamp(32px, 5vw, 44px); letter-spacing: -.02em; line-height: 1.1; margin: 0 0 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
          padding: 28px 24px; color: var(--muted); }
  .card p { margin: 0 0 12px; }
  .card p:last-child { margin: 0; }
  footer { padding: 28px 0 40px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="../"><img src="../bodyscope-icon.png?v=2" alt="" width="34" height="34">Bodyscope</a>
    <a class="back" href="../">← Back to Bodyscope</a>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>The author</h1>
    <div class="card">
      <!-- Page to be written: about the author of Bodyscope. -->
      <p>This page is coming soon.</p>
      <p>Meanwhile, you can write to us at
        <a href="mailto:bodyscope.team@gmail.com">bodyscope.team@gmail.com</a>.</p>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <a href="../">Bodyscope</a> · <a href="mailto:bodyscope.team@gmail.com">Contact</a>
  </div>
</footer>
</body>
</html>
